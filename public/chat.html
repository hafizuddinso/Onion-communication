<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communication — Onion Communication</title><link rel="stylesheet" href="/styles.css?v=6.4"></head><body class="plain"><header class="top"><div class="wrap topin"><a class="brand brand-lockup compact" href="/"><img src="/logo.svg?v=6.4" alt=""><span><strong>Onion Communication</strong></span></a><nav class="system-nav"><a href="/" class="home-link">Research home</a><a href="/chat" class="system-link active">Chat</a><a href="/aes" class="system-link">AES-GCM</a><a href="/ecdh" class="system-link">ECDH</a><button class="linkbutton signout" onclick="LocalAuth.logout()">Sign out</button></nav></div></header><main class="comm"><aside><p class="eyebrow">Research prototype</p><h2>General channel</h2><p>This browser-only room is for testing the interface. Messages are stored locally until Supabase is connected.</p><div class="signed"><span>Signed in as</span><strong id="who"></strong></div></aside><section class="conversation"><div class="convhead"><div><strong>General</strong><span>Local prototype</span></div><span class="dot">● local</span></div><div class="messages" id="messages"></div><form class="composer" id="composer"><input id="text" maxlength="4000" autocomplete="off" placeholder="Write a message"><button>Send</button></form></section></main><script src="/local-auth.js"></script><script>const user=LocalAuth.user();if(!user)location.href='/login';else who.textContent=user.name+' · '+user.email;const safe=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};function render(){messages.innerHTML='';const all=LocalAuth.messages();if(!all.length){messages.innerHTML='<div class="empty"><strong>No messages yet.</strong><span>Send the first message to test the conversation layout.</span></div>';return}all.forEach(m=>{const own=m.user_id===user.id,el=document.createElement('article');el.className='message '+(own?'mine':'');const t=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});el.innerHTML=`<div class="messageinfo">${safe(m.display_name)} <span>${t}</span></div><div class="bubble">${safe(m.body)}</div>`;messages.appendChild(el)});messages.scrollTop=messages.scrollHeight}render();window.addEventListener('oc-message',render);composer.onsubmit=e=>{e.preventDefault();const b=text.value.trim();if(!b)return;LocalAuth.send(b);text.value=''};</script></body></html>
